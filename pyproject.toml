# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinfast"
version = "0.0.1"
description = "Load any robot, then run it 10,000x in parallel on your GPU — differentiable, in five lines."
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
